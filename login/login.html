
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-image">
        <div class="bg-overlay"></div>
        
        <div class="login-card">
            <h2 class="login-title" id="form-title">Login</h2>
            
            <div id="error-msg" class="alert alert-danger d-none" style="font-size: 14px; padding: 8px;"></div>

            <form id="login-form">
                <input type="text" id="login-folio" class="form-control" placeholder="Folio (Ej: ADM-0001 o OPR-1045)" required autocomplete="off">
                <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
                <button type="submit" class="btn-login">LOGIN</button>
            </form>

            <form id="registro-form">
                <input type="text" id="reg-nombre" class="form-control" placeholder="Nombre Completo" required>
                <input type="text" id="reg-folio" class="form-control" placeholder="Nuevo Folio (ADM-XXXX o OPR-XXXX)" required autocomplete="off">
                <input type="password" id="reg-pass" class="form-control" placeholder="Crear Contraseña" required>
                <button type="submit" class="btn-login" style="background-color: var(--azul-rey);">REGISTRARSE</button>
            </form>

            <span class="toggle-link" id="toggle-btn">¿No tienes cuenta? Regístrate aquí</span>
        </div>
    </div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const registroForm = document.getElementById('registro-form');
            const formTitle = document.getElementById('form-title');
            const toggleBtn = document.getElementById('toggle-btn');
            const errorMsg = document.getElementById('error-msg');
            
            let isLogin = true;

            // Alternar entre Login y Registro
            toggleBtn.addEventListener('click', () => {
                isLogin = !isLogin;
                errorMsg.classList.add('d-none'); // Limpiar errores
                
                if(isLogin) {
                    formTitle.innerText = 'Login';
                    loginForm.style.display = 'block';
                    registroForm.style.display = 'none';
                    toggleBtn.innerText = '¿No tienes cuenta? Regístrate aquí';
                } else {
                    formTitle.innerText = 'Registro';
                    loginForm.style.display = 'none';
                    registroForm.style.display = 'block';
                    toggleBtn.innerText = '¿Ya tienes cuenta? Inicia sesión';
                }
            });

            // Función para validar la nomenclatura del folio
            function validarFolio(folio) {
                const folioLimpio = folio.trim().toUpperCase();
                // Expresión regular: Empieza con ADM- o OPR-, seguido de exactamente 4 números
                const regex = /^(ADM|OPR)-\d{4}$/;
                
                if (!regex.test(folioLimpio)) {
                    return false;
                }
                return folioLimpio;
            }

            // Manejar envío de Login con FETCH hacia PHP
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const folio = document.getElementById('login-folio').value;
                const pass = document.getElementById('login-pass').value;
                const folioValidado = validarFolio(folio);

                if (!folioValidado) {
                    errorMsg.innerText = "Formato de folio inválido. Usa ADM-XXXX u OPR-XXXX.";
                    errorMsg.classList.remove('d-none');
                    return;
                }

                if (!pass) {
                    errorMsg.innerText = "Por favor, ingresa tu contraseña.";
                    errorMsg.classList.remove('d-none');
                    return;
                }

                errorMsg.classList.add('d-none');

                try {
                    // Petición al backend PHP
                    const response = await fetch('login.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ folio: folioValidado, password: pass })
                    });
                    
                    const result = await response.json();

                    if (result.success) {
                        // Guardamos datos en el navegador para la interfaz visual
                        localStorage.setItem('sesion_iniciada', 'true');
                        localStorage.setItem('usuario_rol', result.rol);
                        localStorage.setItem('usuario_folio', result.folio);

                        window.location.href = '../panelAdmin/panelAdmin.php';
                    } else {
                        // Mostrar error devuelto por la base de datos (contraseña incorrecta, etc.)
                        errorMsg.innerText = result.message;
                        errorMsg.classList.remove('d-none');
                    }
                } catch (error) {
                    console.error("Error en el login:", error);
                    errorMsg.innerText = "Ocurrió un error al intentar conectar con el servidor.";
                    errorMsg.classList.remove('d-none');
                }
            });

            // Manejar envío de Registro (Para futura implementación con backend)
            registroForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const folio = document.getElementById('reg-folio').value;
                const folioValidado = validarFolio(folio);

                if (!folioValidado) {
                    errorMsg.innerText = "El folio debe ser ADM-XXXX u OPR-XXXX.";
                    errorMsg.classList.remove('d-none');
                    return;
                }

                errorMsg.classList.add('d-none');
                alert(`Petición de registro enviada a la base de datos para: ${folioValidado} (Falta conectar backend de registro)`);
            });
        });
    </script>
</body>
</html>
